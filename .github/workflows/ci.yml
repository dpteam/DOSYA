name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # Fast job: no toolchain. Proves the game is playable.
  smoke:
    name: Playable (host build + autopilot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Cache GNU Unifont
        uses: actions/cache@v5
        with:
          path: vendor/unifont.hex.gz
          key: unifont-15.1.05

      # The font is ~1 MB and is not in git. genfont.py would fetch it itself,
      # but doing it here keeps the download out of the build log and makes a
      # network failure show up as its own red step.
      - name: Fetch font
        run: python tools/setup.py --font

      - name: Build host binary
        run: python tools/build.py host

      - name: Autopilot must clear all three levels
        run: python tools/smoke.py

      - name: Level validator
        # genlevels.py relocates enemies that sit too close to a pit and exits
        # non-zero if any level is still unfair.
        run: python tools/genlevels.py

      - name: Docs links resolve
        run: python tools/check_links.py

  # The real thing: cross-compile a DOS executable.
  dos:
    name: DOS build (DJGPP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Cache DJGPP and Unifont
        uses: actions/cache@v5
        with:
          path: vendor
          key: djgpp-v3.4-gcc1220-linux64-unifont-15.1.05

      - name: Fetch toolchain and font
        run: python tools/setup.py

      - name: Build DOSYA.EXE
        run: python tools/build.py dos

      - name: Verify it is a real DOS executable
        run: |
          python - <<'PY'
          import os
          p = "dist/DOSYA.EXE"
          assert os.path.exists(p), "DOSYA.EXE was not produced"
          data = open(p, "rb").read()
          assert data[:2] == b"MZ", "not an MZ executable"
          assert len(data) > 100_000, "suspiciously small for a DJGPP build"
          assert b"go32" in data.lower(), "no DJGPP loader stub found"
          assert os.path.exists("dist/CWSDPMI.EXE"), "DPMI host was not bundled"
          print("OK: %s, %d bytes, MZ header + go32 stub" % (p, len(data)))
          PY

      # Actually running the EXE needs DOSBox, which is not on the runner.
      # The host build runs the same game code and is smoke-tested above;
      # for the DOS binary itself see docs/building.md ("Self-test").

      - uses: actions/upload-artifact@v6
        with:
          name: DOSYA-DOS
          path: |
            dist/DOSYA.EXE
            dist/CWSDPMI.EXE
          if-no-files-found: error

  # Generated assets must be reproducible: running the generators twice must
  # produce byte-identical output, or the art is not really source-controlled.
  reproducible:
    name: Assets are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Cache GNU Unifont
        uses: actions/cache@v5
        with:
          path: vendor/unifont.hex.gz
          key: unifont-15.1.05

      - name: Fetch font
        run: python tools/setup.py --font

      - name: Generate twice and compare
        run: |
          python tools/genpal.py
          python tools/art_all.py
          python tools/gen_tiles.py
          python tools/genfont.py
          python tools/genstrings.py
          python tools/genlevels.py
          mkdir -p /tmp/first
          cp -r build/gen /tmp/first/
          python tools/genpal.py
          python tools/art_all.py
          python tools/gen_tiles.py
          python tools/genfont.py
          python tools/genstrings.py
          python tools/genlevels.py
          diff -r /tmp/first/gen build/gen
          echo "generated sources are deterministic"

      - name: Icon builds
        run: |
          python tools/gen_icon.py
          python - <<'PY'
          from PIL import Image
          for p in ("docs/icon.png", "docs/banner.png"):
              im = Image.open(p)
              print(p, im.size, im.mode)
          assert Image.open("docs/icon.png").size == (512, 512)
          PY
