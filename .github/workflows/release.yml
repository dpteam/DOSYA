name: Release

# Tag a commit with v1.0.0 and this builds the DOS binaries and attaches a zip
# to the GitHub release. No secrets needed: GITHUB_TOKEN is enough.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Cache DJGPP
        uses: actions/cache@v5
        with:
          path: vendor
          key: djgpp-v3.4-gcc1220-linux64-unifont-15.1.05

      - name: Fetch toolchain
        run: python tools/setup.py

      - name: Build
        run: python tools/build.py dos

      - name: Smoke test the same code
        run: |
          python tools/build.py host
          python tools/smoke.py

      - name: Assemble the DOS package
        run: python tools/package.py "${{ github.ref_name }}"

      - name: Show what will be published
        run: ls -la dosya-*.zip

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: dosya-*.zip
          body: |
            ## ДОСЯ и автобус

            Платформер для DOS. 320x200x256, Mode 13h, DJGPP.

            **Запуск:** распакуйте архив, запустите `DOSYA.EXE` в DOSBox
            или на настоящей DOS-машине. `CWSDPMI.EXE` должен лежать рядом.

            ```
            mount c <папка>
            c:
            DOSYA.EXE
            ```

            Управление: стрелки — идти, пробел — прыжок, Z — навоз, P — пауза.
          generate_release_notes: true
