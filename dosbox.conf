[sdl]
fullscreen=false
windowresolution=960x600
output=surface
autolock=false

[dosbox]
machine=svga_s3
memsize=16

[render]
aspect=true
scaler=none

[cpu]
core=auto
cycles=fixed 20000

[mixer]
nosound=true

[autoexec]
# Run DOSBox from the repository root so this relative mount resolves:
#   dosbox -conf dosbox.conf
mount c dist
c:
DOSYA.EXE
